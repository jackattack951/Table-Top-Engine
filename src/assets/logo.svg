<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Spotlight housing -->
  <path d="M24 8h16l4 10H20L24 8z" fill="currentColor" opacity="0.9"/>
  <!-- Spotlight beam (triangle of light) -->
  <path d="M22 18L10 56h44L42 18H22z" fill="currentColor" opacity="0.08"/>
  <path d="M22 18L10 56h44L42 18" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  <!-- D20 (icosahedron face) centered in beam -->
  <polygon points="32,26 42,44 22,44" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="currentColor" fill-opacity="0.15"/>
  <!-- D20 inner lines -->
  <line x1="32" y1="26" x2="27" y2="38" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="26" x2="37" y2="38" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="22" y1="44" x2="37" y2="38" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="42" y1="44" x2="27" y2="38" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <!-- "20" text inside -->
  <text x="32" y="42" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="currentColor" opacity="0.7">20</text>
  <!-- Mounting bracket -->
  <rect x="28" y="4" width="8" height="5" rx="1" fill="currentColor" opacity="0.6"/>
</svg>
